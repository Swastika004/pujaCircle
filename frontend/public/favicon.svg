<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Solid Crimson background -->
  <rect width="32" height="32" rx="7" fill="#B91C1C" />

  <!-- Inner Dark Sacred Disc -->
  <circle cx="16" cy="16" r="11.5" fill="#450A0A" stroke="#EAB308" stroke-width="0.75" />

  <!-- Auspicious Haldi Gold Ring -->
  <circle cx="16" cy="16" r="11.5" stroke="#EAB308" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="48 24" stroke-dashoffset="10" />

  <!-- Sacred Om (ॐ) Symbol -->
  <text
    x="16"
    y="21.5"
    text-anchor="middle"
    fill="#FBBF24"
    font-size="15"
    font-weight="bold"
    font-family="'Noto Sans Devanagari', 'Nirmala UI', 'Segoe UI Historic', 'Mangal', sans-serif"
  >ॐ</text>
</svg>
